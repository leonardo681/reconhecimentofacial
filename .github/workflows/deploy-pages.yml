# Copia o build (dist) para a pasta docs/ na main.
#
# Em GitHub: Settings → Pages → Deploy from a branch → main → /docs
#
# Ignora pushes que alteram só docs/ (evita loop quando o bot faz commit).
# Antes de publicar, roda lint, checagem de tipos e testes: se algo falhar, nada é publicado.
name: Deploy site to docs

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-docs
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: main
          folder: dist
          target-folder: docs
          commit-message: "chore: update GitHub Pages [skip ci]"
